server:
  port: 8080
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: search_service
  data:
    web:
      pageable:
        max-page-size: 100000
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master-changelog.xml
    drop-first: false
    default-schema: public
    contexts: dev,test,prod
  datasource:
    url: jdbc:postgresql://localhost:5432/search_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s
storage:
  path: C:/Users/bunae/OneDrive/Projects/rem_files/
