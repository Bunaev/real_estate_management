<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали ЖК</title>
    <link rel="icon" type="image/png" href="/fav.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f0f2f5;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        .container-fluid {
            max-width: 1600px;
            margin: 0 auto;
            transition: padding-right 0.3s ease;
            padding-right: 0;
        }
        .container-fluid.shifted { padding-right: 380px; }

        .header {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header .back-link { color: #aaa; text-decoration: none; font-size: 18px; transition: 0.3s; }
        .header .back-link:hover { color: white; }
        .header .complex-title h1 { margin: 0; font-size: 28px; font-weight: 600; }
        .header .complex-title small { display: block; font-size: 14px; opacity: 0.7; }

        .filter-toggle-btn {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1050;
            background: #0f3460;
            color: white;
            border: none;
            border-radius: 8px 0 0 8px;
            padding: 12px 8px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
        }
        .filter-toggle-btn:hover { background: #1a1a2e; padding-left: 14px; }
        .filter-toggle-btn.shifted { right: 380px; }

        .offcanvas { width: 380px !important; }
        .offcanvas-body { padding: 20px; }
        .filter-group { margin-bottom: 20px; }
        .filter-group label { font-weight: 600; font-size: 14px; color: #1a1a2e; display: block; margin-bottom: 5px; }
        .filter-group select, .filter-group input[type="number"] {
            width: 100%; padding: 6px 12px; border-radius: 6px; border: 1px solid #ddd;
        }
        .filter-actions {
            display: flex; gap: 10px; margin-top: 30px;
            border-top: 1px solid #dee2e6; padding-top: 20px;
        }
        .filter-actions button { flex: 1; }

        .type-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
        .type-btn {
            flex: 1 0 calc(14.28% - 6px); min-width: 38px; max-width: 48px;
            padding: 8px 2px; border: 2px solid #dee2e6; border-radius: 8px;
            background: white; color: #495057; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.15s ease; text-align: center; user-select: none; line-height: 1.2;
        }
        .type-btn:hover { border-color: #adb5bd; background: #f8f9fa; }
        .type-btn.active {
            background: #0f3460; border-color: #0f3460; color: white;
            box-shadow: 0 2px 8px rgba(15, 52, 96, 0.3);
        }
        .type-btn .btn-sub { display: block; font-size: 8px; font-weight: 400; opacity: 0.6; text-transform: uppercase; }
        .type-btn.active .btn-sub { opacity: 0.8; }

        .range-wrapper { margin: 12px 0 4px; }
        .range-values { display: flex; justify-content: space-between; font-size: 13px; color: #495057; margin-top: 4px; }
        .range-values .range-min, .range-values .range-max { font-weight: 600; color: #0f3460; }

        .table-wrapper { overflow-x: auto; transition: all 0.3s ease; }
        .apartment-table {
            width: 100%; border-collapse: collapse; font-size: 14px; background: white;
            border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            table-layout: auto; min-width: 900px;
        }
        .apartment-table th {
            background: #f8f9fa; color: #1a1a2e; font-weight: 600;
            padding: 12px 8px; text-align: left; border-bottom: 2px solid #dee2e6; white-space: nowrap;
        }
        .apartment-table td {
            padding: 10px 8px; border-bottom: 1px solid #f0f0f0;
            vertical-align: middle; white-space: nowrap;
        }
        .apartment-table tbody tr { cursor: pointer; transition: background 0.15s; }
        .apartment-table tbody tr:hover { background: #f8f9fa !important; }

        .apartment-table .col-number { width: 60px; text-align: center; }
        .apartment-table .col-building { width: 90px; }
        .apartment-table .col-entrance { width: 90px; }
        .apartment-table .col-floor { width: 60px; text-align: center; }
        .apartment-table .col-area { width: 80px; text-align: center; }
        .apartment-table .col-type { width: 85px; text-align: center; }
        .apartment-table .col-bathroom { width: 95px; text-align: center; }
        .apartment-table .col-balcony { width: 60px; text-align: center; }
        .apartment-table .col-price { width: 110px; text-align: right; }
        .apartment-table .col-status { width: 100px; text-align: center; }
        .apartment-table .col-actions { width: 80px; text-align: center; }

        .status-available { background: #e8f5e9; }
        .status-reserved { background: #f5f5f5; }
        .status-sold { background: #e0e0e0; }

        .apartment-actions { display: flex; gap: 6px; justify-content: center; }
        .apartment-actions button { border: none; background: transparent; font-size: 16px; padding: 4px 6px; border-radius: 6px; transition: 0.2s; }
        .apartment-actions .edit-btn { color: #0f3460; }
        .apartment-actions .edit-btn:hover { background: #e9ecef; }
        .apartment-actions .delete-btn { color: #dc3545; }
        .apartment-actions .delete-btn:hover { background: #f8d7da; }

        .empty-state { text-align: center; padding: 60px 20px; color: #6c757d; }
        .empty-state i { font-size: 48px; color: #dee2e6; }
        .apartment-number { font-weight: 700; color: #1a1a2e; }
        .badge-status { font-size: 12px; padding: 3px 12px; border-radius: 20px; }
        .badge-available { background: #c8e6c9; color: #1e7e34; }
        .badge-reserved { background: #fff3cd; color: #856404; }
        .badge-sold { background: #d6d8db; color: #383d41; }

        /* ===== СОРТИРОВКА ===== */
        .sort-header {
            cursor: pointer; user-select: none;
            display: inline-flex; align-items: center; gap: 4px;
            transition: 0.2s; padding: 2px 4px; border-radius: 4px;
        }
        .sort-header:hover { background: rgba(0,0,0,0.05); color: #0f3460; }
        .sort-icon { font-size: 12px; opacity: 0.3; transition: 0.2s; }
        .sort-icon.active { opacity: 1; color: #0f3460; }

        /* ===== ПАГИНАЦИЯ ===== */
        .pagination-wrapper {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; flex-wrap: wrap; gap: 12px;
            background: white; border-top: 1px solid #f0f0f0;
        }
        .pagination-info { color: #6c757d; font-size: 14px; }
        .pagination-controls { display: flex; gap: 8px; align-items: center; }
        .page-btn {
            width: 32px; height: 32px; border: 1px solid #dee2e6; border-radius: 6px;
            background: white; cursor: pointer; display: inline-flex; align-items: center;
            justify-content: center; font-size: 14px; transition: 0.15s;
        }
        .page-btn:hover { background: #f0f2f5; border-color: #0f3460; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-btn.active { background: #0f3460; color: white; border-color: #0f3460; }

        @media (max-width: 1200px) {
            .container-fluid.shifted { padding-right: 0; }
            .offcanvas { width: 100% !important; max-width: 380px !important; }
            .filter-toggle-btn.shifted { right: 100%; }
            .apartment-table { font-size: 13px; min-width: 800px; }
            .apartment-table th, .apartment-table td { padding: 8px 6px; }
        }
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header .complex-title h1 { font-size: 22px; }
            .apartment-table { font-size: 12px; min-width: 700px; }
            .apartment-table th, .apartment-table td { padding: 6px 4px; }
            .filter-toggle-btn { padding: 10px 6px; font-size: 16px; }
            .type-btn { flex: 1 0 calc(20% - 6px); }
        }
        .loading-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.3);
            z-index: 9998; justify-content: center; align-items: center;
        }
        .loading-spinner {
            background: white; padding: 20px 40px; border-radius: 12px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 12px;
        }
    </style>
</head>
<body>

<button class="filter-toggle-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterPanel">
    <i class="bi bi-funnel"></i>
</button>

<div class="container-fluid" id="mainContainer">
    <div class="header">
        <div class="d-flex align-items-center gap-3">
            <a href="/" class="back-link"><i class="bi bi-arrow-left"></i> На главную</a>
            <div class="complex-title">
                <h1 id="complexName">Загрузка...</h1>
                <small id="complexAddress"></small>
            </div>
        </div>
        <div>
            <span class="badge bg-light text-dark" id="complexDeveloper">Застройщик</span>
            <span class="badge bg-light text-dark ms-2" id="complexDistrict">Район</span>
        </div>
    </div>

    <!-- ПАНЕЛЬ ФИЛЬТРОВ -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="filterPanel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title"><i class="bi bi-funnel"></i> Фильтры</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <form id="filterForm" onsubmit="return false;">
                <div class="filter-group">
                    <label>Тип квартиры</label>
                    <div class="type-buttons" id="filterTypesContainer">
                        <button class="type-btn" data-value="STUDIO">С<span class="btn-sub">студия</span></button>
                        <button class="type-btn" data-value="ONE_ROOM">1<span class="btn-sub">комн</span></button>
                        <button class="type-btn" data-value="TWO_ROOM_EURO">2Е<span class="btn-sub">евро</span></button>
                        <button class="type-btn" data-value="TWO_ROOM">2<span class="btn-sub">комн</span></button>
                        <button class="type-btn" data-value="THREE_ROOM_EURO">3Е<span class="btn-sub">евро</span></button>
                        <button class="type-btn" data-value="THREE_ROOM">3<span class="btn-sub">комн</span></button>
                        <button class="type-btn" data-value="FOUR_ROOM_EURO">4Е<span class="btn-sub">евро</span></button>
                    </div>
                </div>

                <div class="filter-group">
                    <label>Тип санузла</label>
                    <select class="form-select" id="filterBathroomType">
                        <option value="">Все</option>
                        <option value="COMBINED">Совмещённый</option>
                        <option value="SEPARATE">Раздельный</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Корпус</label>
                    <select class="form-select" id="filterBuilding"><option value="">Все</option></select>
                </div>

                <div class="filter-group">
                    <label>Секция</label>
                    <select class="form-select" id="filterEntrance"><option value="">Все</option></select>
                </div>

                <div class="filter-group">
                    <label>Этаж</label>
                    <div class="range-wrapper"><div id="floorSlider" class="noUiSlider"></div></div>
                    <div class="range-values">
                        <span class="range-min" id="floorMinLabel">-</span>
                        <span class="range-max" id="floorMaxLabel">-</span>
                    </div>
                </div>

                <div class="filter-group">
                    <label>Площадь, м²</label>
                    <div class="range-wrapper"><div id="areaSlider" class="noUiSlider"></div></div>
                    <div class="range-values">
                        <span class="range-min" id="areaMinLabel">-</span>
                        <span class="range-max" id="areaMaxLabel">-</span>
                    </div>
                </div>

                <div class="filter-group">
                    <label>Цена, ₽</label>
                    <div class="range-wrapper"><div id="priceSlider" class="noUiSlider"></div></div>
                    <div class="range-values">
                        <span class="range-min" id="priceMinLabel">-</span>
                        <span class="range-max" id="priceMaxLabel">-</span>
                    </div>
                </div>

                <div class="filter-group">
                    <label>Балкон</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="filterBalcony">
                        <label class="form-check-label" for="filterBalcony">Только с балконом</label>
                    </div>
                </div>

                <div class="filter-actions">
                    <button type="button" class="btn btn-primary" id="applyFiltersBtn">Применить</button>
                    <button type="button" class="btn btn-outline-secondary" id="resetFiltersBtn">Сбросить все</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ТАБЛИЦА -->
    <div id="apartmentList">
        <div class="text-center py-5 text-muted">Загрузка квартир...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>
<script>
    // =============================================================
    // 1. КОНСТАНТЫ И ГЛОБАЛЬНОЕ СОСТОЯНИЕ
    // =============================================================
    const pathParts = window.location.pathname.split('/');
    const complexId = pathParts[pathParts.length - 1];
    const API = '/api';

    let complexData = null;
    let buildingsMap = {};
    let entrancesMap = {};

    // Пул ВСЕХ квартир ЖК. Нужен для того, чтобы динамические границы
    // слайдеров считались по всем квартирам комплекса, а не по текущей
    // странице / предыдущему результату фильтрации.
    let apartmentPool = [];

    // Текущая страница (как вернул сервер) — для отрисовки таблицы.
    let allApartments = [];

    // Пагинация / сортировка
    let currentPage = 0;
    let pageSize = 50;
    let totalPages = 1;
    let totalElements = 0;
    let sortField = 'price';
    let sortDir = 'asc';

    // Слайдеры
    let floorSlider = null;
    let areaSlider = null;
    let priceSlider = null;
    let slidersInited = false;

    // Колонка таблицы → поле для сортировки на бэкенде.
    // Пустая строка = сортировка клиентская (поля вложенных связей).
    const SORT_BACKEND = {
        number: 'number',
        building: '',
        entrance: '',
        floor: 'floor',
        area: 'area',
        type: 'type',
        bathroom: 'bathroomType',
        balcony: 'hasBalcony',
        price: 'price',
        status: 'status'
    };

    // =============================================================
    // 2. ФОРМАТИРОВАНИЕ
    // =============================================================
    function formatApartmentType(type) {
        const map = { STUDIO: 'Студия', ONE_ROOM: '1к-ком.', TWO_ROOM_EURO: '2Е', TWO_ROOM: '2к-ком.', THREE_ROOM_EURO: '3Е', THREE_ROOM: '3к-ком.', FOUR_ROOM_EURO: '4Е' };
        return map[type] || type || '—';
    }
    function formatBathroomType(type) {
        return type === 'COMBINED' ? 'Совмещённый' : type === 'SEPARATE' ? 'Раздельный' : (type || '—');
    }
    function formatStatus(status) {
        const map = { AVAILABLE: 'Свободна', RESERVED: 'Забронирована', SOLD: 'Продана' };
        return map[status] || status || '—';
    }
    function getStatusClass(s) {
        return s === 'AVAILABLE' ? 'status-available' : s === 'RESERVED' ? 'status-reserved' : s === 'SOLD' ? 'status-sold' : '';
    }
    function getStatusBadgeClass(s) {
        return s === 'AVAILABLE' ? 'badge-available' : s === 'RESERVED' ? 'badge-reserved' : s === 'SOLD' ? 'badge-sold' : 'badge-secondary';
    }
    function showLoading(show) {
        const el = document.getElementById('loadingOverlay');
        if (el) el.style.display = show ? 'flex' : 'none';
    }
    function showToast(m) { alert(m); }

    // =============================================================
    // 3. ЧТЕНИЕ ТЕКУЩИХ «ЖЁСТКИХ» ФИЛЬТРОВ (без слайдеров)
    // =============================================================
    function activeTypes() {
        return Array.from(document.querySelectorAll('#filterTypesContainer .type-btn.active')).map(b => b.dataset.value);
    }
    function getBathroomFilter() { return document.getElementById('filterBathroomType').value; }
    function getBuildingFilter() { return document.getElementById('filterBuilding').value; }
    function getEntranceFilter() { return document.getElementById('filterEntrance').value; }
    function isBalconyFilter() { return document.getElementById('filterBalcony').checked; }

    // Совпадает ли квартира с выбранными типами/санузлом/корпусом/секцией/балконом.
    function hardFilterMatch(ap) {
        const types = activeTypes();
        if (types.length && !types.includes(ap.type)) return false;

        const bth = getBathroomFilter();
        if (bth && ap.bathroomType !== bth) return false;

        const bld = getBuildingFilter();
        if (bld && !(ap.entrance && ap.entrance.building && String(ap.entrance.building.id) === String(bld))) return false;

        const ent = getEntranceFilter();
        if (ent && !(ap.entrance && String(ap.entrance.id) === String(ent))) return false;

        if (isBalconyFilter() && !ap.hasBalcony) return false;

        return true;
    }

    // =============================================================
    // 4. ЗАГРУЗКА ПУЛА ВСЕХ КВАРТИР ЖК
    // =============================================================
    async function loadApartmentPool() {
        const url = `${API}/apartments/filter?residentialComplexId=${complexId}&page=0&size=100000&sort=id,asc`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Ошибка загрузки пула квартир');
        const data = await res.json();
        apartmentPool = Array.isArray(data.content) ? data.content : (Array.isArray(data) ? data : []);
    }

    // =============================================================
    // 5. ДИНАМИЧЕСКИЕ ГРАНИЦЫ СЛАЙДЕРОВ
    //    = min/max по ВСЕМ квартирам ЖК, удовлетворяющим «жёстким»
    //      фильтрам (типы/санузел/корпус/секция/балкон). Слайдеры при
    //      изменении этих фильтров сбрасываются на полный диапазон,
    //      поэтому не «запирают» выборку при расширении фильтра.
    // =============================================================
    function computeLimits() {
        const subset = apartmentPool.filter(hardFilterMatch);
        let minFloor = Infinity, maxFloor = -Infinity;
        let minArea = Infinity, maxArea = -Infinity;
        let minPrice = Infinity, maxPrice = -Infinity;
        subset.forEach(a => {
            if (typeof a.floor === 'number' && isFinite(a.floor)) { if (a.floor < minFloor) minFloor = a.floor; if (a.floor > maxFloor) maxFloor = a.floor; }
            if (typeof a.area === 'number' && isFinite(a.area)) { if (a.area < minArea) minArea = a.area; if (a.area > maxArea) maxArea = a.area; }
            if (typeof a.price === 'number' && isFinite(a.price)) { if (a.price < minPrice) minPrice = a.price; if (a.price > maxPrice) maxPrice = a.price; }
        });
        return {
            floor: isFinite(minFloor) ? [minFloor, maxFloor] : [1, 200],
            area: isFinite(minArea) ? [minArea, maxArea] : [0, 10000],
            price: isFinite(minPrice) ? [minPrice, maxPrice] : [0, 100000000]
        };
    }

    function applySliderRange(slider, range) {
        if (!slider || !slider.noUiSlider) return;
        let [min, max] = range;
        if (min === max) {
            // noUiSlider требует min < max — делаем маленький запас вокруг значения
            slider.noUiSlider.updateOptions({ range: { min: min - 1, max: max + 1 } });
            slider.noUiSlider.set([min, max]);
            return;
        }
        slider.noUiSlider.updateOptions({ range: { min: min, max: max } });
        slider.noUiSlider.set([min, max]);
    }

    function refreshSliderLimits() {
        if (!slidersInited) return;
        const lim = computeLimits();
        applySliderRange(floorSlider, lim.floor);
        applySliderRange(areaSlider, lim.area);
        applySliderRange(priceSlider, lim.price);
        renderSliderLabels();
    }

    function renderSliderLabels() {
        const lim = computeLimits();
        document.getElementById('floorMinLabel').textContent = lim.floor[0];
        document.getElementById('floorMaxLabel').textContent = lim.floor[1];
        document.getElementById('areaMinLabel').textContent = +lim.area[0].toFixed(1);
        document.getElementById('areaMaxLabel').textContent = +lim.area[1].toFixed(1);
        document.getElementById('priceMinLabel').textContent = Math.round(lim.price[0]).toLocaleString();
        document.getElementById('priceMaxLabel').textContent = Math.round(lim.price[1]).toLocaleString();
    }

    // =============================================================
    // 6. ИНИЦИАЛИЗАЦИЯ СЛАЙДЕРОВ (один раз)
    // =============================================================
    function initSliders() {
        const fs = document.getElementById('floorSlider');
        noUiSlider.create(fs, { start: [1, 200], connect: true, step: 1, range: { min: 1, max: 200 }, format: { to: v => Math.round(v), from: v => Math.round(parseFloat(v)) } });
        fs.noUiSlider.on('update', v => {
            const el1 = document.getElementById('floorMinLabel');
            const el2 = document.getElementById('floorMaxLabel');
            if (el1) el1.textContent = Math.round(v[0]);
            if (el2) el2.textContent = Math.round(v[1]);
        });
        floorSlider = fs;

        const as = document.getElementById('areaSlider');
        noUiSlider.create(as, { start: [0, 10000], connect: true, step: 0.5, range: { min: 0, max: 10000 }, format: { to: v => parseFloat(v).toFixed(1), from: v => parseFloat(v) } });
        as.noUiSlider.on('update', v => {
            const el1 = document.getElementById('areaMinLabel');
            const el2 = document.getElementById('areaMaxLabel');
            if (el1) el1.textContent = parseFloat(v[0]).toFixed(1);
            if (el2) el2.textContent = parseFloat(v[1]).toFixed(1);
        });
        areaSlider = as;

        const ps = document.getElementById('priceSlider');
        noUiSlider.create(ps, { start: [0, 100000000], connect: true, step: 1000, range: { min: 0, max: 100000000 }, format: { to: v => Math.round(v), from: v => Math.round(parseFloat(v)) } });
        ps.noUiSlider.on('update', v => {
            const el1 = document.getElementById('priceMinLabel');
            const el2 = document.getElementById('priceMaxLabel');
            if (el1) el1.textContent = Math.round(v[0]).toLocaleString();
            if (el2) el2.textContent = Math.round(v[1]).toLocaleString();
        });
        priceSlider = ps;
    }

    // =============================================================
    // 7. ЗАГРУЗКА КВАРТИР С СЕРВЕРА (таблица)
    //    Границы слайдеров здесь НЕ пересчитываются: они всегда
    //    считаются от пула (refreshSliderLimits).
    // =============================================================
    function loadApartments() {
        const params = new URLSearchParams();
        params.append('residentialComplexId', complexId);
        params.append('page', currentPage);
        params.append('size', pageSize);
        const backendField = SORT_BACKEND[sortField] || 'price';
        if (backendField) params.append('sort', `${backendField},${sortDir}`);

        const bld = getBuildingFilter();
        if (bld) params.append('buildingId', bld);
        const ent = getEntranceFilter();
        if (ent) params.append('entranceId', ent);

        activeTypes().forEach(t => params.append('types', t));

        const bth = getBathroomFilter();
        if (bth) params.append('bathroomType', bth);

        // Слайдеры: текущие значения ручек.
        if (slidersInited) {
            const fv = floorSlider.noUiSlider.get();
            params.append('floorFrom', Math.round(fv[0]));
            params.append('floorTo', Math.round(fv[1]));
            const av = areaSlider.noUiSlider.get();
            params.append('areaFrom', parseFloat(av[0]));
            params.append('areaTo', parseFloat(av[1]));
            const pv = priceSlider.noUiSlider.get();
            params.append('priceFrom', parseFloat(pv[0]));
            params.append('priceTo', parseFloat(pv[1]));
        }

        if (isBalconyFilter()) params.append('hasBalcony', 'true');

        showLoading(true);
        fetch(`${API}/apartments/filter?${params.toString()}`)
            .then(res => { if (!res.ok) throw new Error(`Ошибка ${res.status}`); return res.json(); })
            .then(data => {
                const apartments = data.content || [];
                totalElements = data.totalElements || 0;
                totalPages = data.totalPages || 1;
                currentPage = data.number || 0;
                allApartments = apartments;
                renderApartments(apartments);
            })
            .catch(err => {
                console.error('Ошибка загрузки квартир:', err);
                document.getElementById('apartmentList').innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><p class="mt-2">Ошибка загрузки квартир</p></div>`;
            })
            .finally(() => showLoading(false));
    }

    // =============================================================
    // 8. ОСНОВНАЯ ЗАГРУЗКА СТРАНИЦЫ
    // =============================================================
    async function loadData() {
        showLoading(true);
        try {
            const cr = await fetch(`${API}/complexes/${complexId}`);
            if (!cr.ok) throw new Error('Ошибка загрузки ЖК');
            complexData = await cr.json();
            renderComplexHeader(complexData);
            populateFilters(complexData);

            if (!slidersInited) {
                initSliders();
                slidersInited = true;
            }

            // Пустой пул → слайдеры показывают полный «пустой» диапазон
            await loadApartmentPool();
            refreshSliderLimits();

            sortField = 'price';
            sortDir = 'asc';
            currentPage = 0;
            loadApartments();
        } catch (e) {
            console.error(e);
            document.getElementById('apartmentList').innerHTML = '<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><p class="mt-2">Ошибка загрузки данных</p></div>';
        } finally {
            showLoading(false);
        }
    }

    function renderComplexHeader(data) {
        document.getElementById('complexName').textContent = data.name || 'Без названия';
        document.getElementById('complexAddress').textContent = data.address || '';
        document.getElementById('complexDeveloper').textContent = '🏗️ ' + (data.developer || '—');
        document.getElementById('complexDistrict').textContent = '🏘️ ' + (data.district || '—');
        if (data.buildings) {
            data.buildings.forEach(b => {
                buildingsMap[b.id] = b.name;
                if (b.entrances) b.entrances.forEach(e => { entrancesMap[e.id] = e.name; });
            });
        }
    }

    // =============================================================
    // 9. ВЫПАДАЮЩИЕ СПИСКИ (корпус → секция)
    // =============================================================
    function populateFilters(complex) {
        const bs = document.getElementById('filterBuilding');
        const es = document.getElementById('filterEntrance');
        const curB = bs.value;
        bs.innerHTML = '<option value="">Все</option>';
        if (complex.buildings) {
            complex.buildings.forEach(b => { bs.innerHTML += `<option value="${b.id}">${b.name}</option>`; });
        }
        if (curB) bs.value = curB;

        const updateEntrances = () => {
            const selB = bs.value;
            es.innerHTML = '<option value="">Все</option>';
            if (!complex.buildings) return;
            if (selB) {
                const bld = complex.buildings.find(b => String(b.id) === String(selB));
                if (bld && bld.entrances) bld.entrances.forEach(e => { es.innerHTML += `<option value="${e.id}">${e.name}</option>`; });
            } else {
                complex.buildings.forEach(b => {
                    if (b.entrances) b.entrances.forEach(e => { es.innerHTML += `<option value="${e.id}">${e.name}</option>`; });
                });
            }
        };

        // Заменяем select корпуса новым, чтобы повесить свежий слушатель
        const newBs = bs.cloneNode(true);
        bs.parentNode.replaceChild(newBs, bs);
        const freshBs = document.getElementById('filterBuilding');
        freshBs.addEventListener('change', () => { updateEntrances(); refreshSliderLimits(); });
        updateEntrances();
    }

    // =============================================================
    // 10. ПАГИНАЦИЯ И СОРТИРОВКА
    // =============================================================
    function applySort(field) {
        if (sortField === field) {
            sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
            sortField = field;
            sortDir = 'asc';
        }
        currentPage = 0;

        const backendField = SORT_BACKEND[field];
        if (!backendField) {
            // Корпус/Секция — вложенные связи, сортируем загруженную страницу клиентски
            sortLocallyAndRender();
            return;
        }
        loadApartments();
    }

    function sortLocallyAndRender() {
        const field = sortField;
        const dir = sortDir === 'asc' ? 1 : -1;
        const sorted = [...allApartments].sort((a, b) => {
            let va, vb;
            if (field === 'building') { va = a.entrance && a.entrance.building ? a.entrance.building.name : ''; vb = b.entrance && b.entrance.building ? b.entrance.building.name : ''; }
            else if (field === 'entrance') { va = a.entrance ? a.entrance.name : ''; vb = b.entrance ? b.entrance.name : ''; }
            else { va = a[field]; vb = b[field]; }
            if (va == null) va = '';
            if (vb == null) vb = '';
            if (typeof va === 'string' || typeof vb === 'string') return String(va).localeCompare(String(vb)) * dir;
            return (Number(va) - Number(vb)) * dir;
        });
        allApartments = sorted;
        renderApartments(sorted);
    }

    function changePage(dir) {
        if (dir === 'prev' && currentPage > 0) currentPage--;
        else if (dir === 'next' && currentPage < totalPages - 1) currentPage++;
        else return;
        loadApartments();
    }

    function changePageSize() {
        pageSize = parseInt(document.getElementById('pageSizeSelect').value);
        currentPage = 0;
        loadApartments();
    }

    // =============================================================
    // 11. ТАБЛИЦА КВАРТИР
    // =============================================================
    function renderApartments(apartments) {
        const container = document.getElementById('apartmentList');
        if (!apartments || apartments.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="bi bi-house"></i><p class="mt-2">Нет квартир, соответствующих фильтрам</p></div>';
            return;
        }
        const total = totalElements || apartments.length;
        const startItem = currentPage * pageSize + 1;
        const endItem = Math.min(startItem + apartments.length - 1, total);

        let html = `<div class="table-wrapper"><table class="apartment-table"><thead><tr>`;
        const cols = [
            ['number', '№', 'col-number'],
            ['building', 'Корпус', 'col-building'],
            ['entrance', 'Секция', 'col-entrance'],
            ['floor', 'Этаж', 'col-floor'],
            ['area', 'Площадь', 'col-area'],
            ['type', 'Формат', 'col-type'],
            ['bathroom', 'Санузел', 'col-bathroom'],
            ['balcony', 'Балкон', 'col-balcony'],
            ['price', 'Цена', 'col-price'],
            ['status', 'Статус', 'col-status']
        ];
        cols.forEach(([field, label, cls]) => {
            const isActive = sortField === field;
            const icon = isActive ? (sortDir === 'asc' ? '↑' : '↓') : '⇅';
            html += `<th class="${cls}"><span class="sort-header" onclick="applySort('${field}')">${label} <span class="sort-icon${isActive ? ' active' : ''}" id="sort-icon-${field}">${icon}</span></span></th>`;
        });
        html += `<th class="col-actions">Действия</th></tr></thead><tbody>`;

        apartments.forEach(ap => {
            const bn = ap.entrance && ap.entrance.building ? ap.entrance.building.name : '—';
            const en = ap.entrance ? ap.entrance.name : '—';
            html += `<tr class="${getStatusClass(ap.status)}" onclick="navigateToApartment(${ap.id})">
                <td class="col-number apartment-number">${ap.number}</td>
                <td class="col-building">${bn}</td>
                <td class="col-entrance">${en}</td>
                <td class="col-floor">${ap.floor}</td>
                <td class="col-area">${ap.area} м²</td>
                <td class="col-type">${formatApartmentType(ap.type)}</td>
                <td class="col-bathroom">${formatBathroomType(ap.bathroomType)}</td>
                <td class="col-balcony">${ap.hasBalcony ? '✅' : '❌'}</td>
                <td class="col-price">${ap.price ? Number(ap.price).toLocaleString() + ' ₽' : '—'}</td>
                <td class="col-status"><span class="badge-status ${getStatusBadgeClass(ap.status)}">${formatStatus(ap.status)}</span></td>
                <td class="col-actions">
                    <div class="apartment-actions">
                        <button class="edit-btn" onclick="event.stopPropagation();editApartment(${ap.id})" title="Редактировать"><i class="bi bi-pencil-square"></i></button>
                        <button class="delete-btn" onclick="event.stopPropagation();deleteApartment(${ap.id})" title="Удалить"><i class="bi bi-trash"></i></button>
                    </div>
                </td>
            </tr>`;
        });
        html += `</tbody></table>`;

        html += `<div class="pagination-wrapper">
            <div class="pagination-info">Показано <strong>${apartments.length}</strong> из <strong>${total}</strong> квартир</div>
            <div class="pagination-controls">
                <button class="page-btn" onclick="changePage('prev')" ${currentPage <= 0 ? 'disabled' : ''}><i class="bi bi-chevron-left"></i></button>
                <span style="font-size:14px;font-weight:500;">${currentPage + 1} / ${totalPages || 1}</span>
                <button class="page-btn" onclick="changePage('next')" ${currentPage >= totalPages - 1 ? 'disabled' : ''}><i class="bi bi-chevron-right"></i></button>
                <span style="margin-left:16px;font-size:14px;color:#6c757d;">На странице:</span>
                <select id="pageSizeSelect" class="form-select form-select-sm" style="width:auto;display:inline-block;" onchange="changePageSize()">
                    <option value="20" ${pageSize === 20 ? 'selected' : ''}>20</option>
                    <option value="50" ${pageSize === 50 ? 'selected' : ''}>50</option>
                    <option value="100" ${pageSize === 100 ? 'selected' : ''}>100</option>
                </select>
            </div>
        </div></div>`;
        container.innerHTML = html;
    }

    // =============================================================
    // 12. КНОПКИ «ПРИМЕНИТЬ» / «СБРОСИТЬ»
    // =============================================================
    function applyFilters() {
        currentPage = 0;
        loadApartments();
    }

    function resetFilters() {
        document.querySelectorAll('#filterTypesContainer .type-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('filterBathroomType').value = '';
        document.getElementById('filterBuilding').value = '';
        document.getElementById('filterEntrance').value = '';
        document.getElementById('filterBalcony').checked = false;

        if (complexData) populateFilters(complexData);

        refreshSliderLimits();

        sortField = 'price';
        sortDir = 'asc';
        currentPage = 0;
        loadApartments();
    }

    // =============================================================
    // 13. СДВИГ КОНТЕЙНЕРА ПРИ ОТКРЫТИИ ПАНЕЛИ ФИЛЬТРОВ
    // =============================================================
    const filterPanelEl = document.getElementById('filterPanel');
    const toggleBtnEl = document.querySelector('.filter-toggle-btn');
    const mainContainerEl = document.getElementById('mainContainer');
    filterPanelEl.addEventListener('show.bs.offcanvas', () => {
        toggleBtnEl.classList.add('shifted');
        mainContainerEl.classList.add('shifted');
    });
    filterPanelEl.addEventListener('hide.bs.offcanvas', () => {
        toggleBtnEl.classList.remove('shifted');
        mainContainerEl.classList.remove('shifted');
    });

    // =============================================================
    // 14. ДЕЙСТВИЯ
    // =============================================================
    function navigateToApartment(id) { alert(`Переход к квартире #${id} (скоро)`); }

    async function deleteApartment(id) {
        if (!confirm('Удалить квартиру #' + id + '?')) return;
        try {
            const res = await fetch(`${API}/apartments/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Ошибка удаления');
            alert('Квартира удалена');
            await refreshPoolAndReload();
        } catch (e) { alert('Ошибка: ' + e.message); }
    }

    // Перезагружает пул (границы слайдеров) и список квартир после изменений БД
    async function refreshPoolAndReload() {
        try {
            await loadApartmentPool();
            refreshSliderLimits();
        } catch (e) { console.error(e); }
        loadApartments();
    }

    // =============================================================
    // 15. РЕДАКТИРОВАНИЕ
    // =============================================================
    function parseNumberInput(v) { if (!v) return null; const c = v.trim().replace(',', '.'); const p = parseFloat(c); return isNaN(p) ? null : p; }

    function editApartment(id) {
        const ap = allApartments.find(a => a.id === id);
        if (!ap) { alert('Квартира не найдена'); return; }
        document.getElementById('editApartmentId').value = ap.id;
        document.getElementById('editApartmentNumber').value = ap.number || '';
        document.getElementById('editApartmentFloor').value = ap.floor || '';
        document.getElementById('editApartmentArea').value = ap.area || '';
        document.getElementById('editApartmentPrice').value = ap.price || '';
        document.getElementById('editApartmentType').value = ap.type || '';
        document.getElementById('editApartmentBathroom').value = ap.bathroomType || '';
        document.getElementById('editApartmentBalcony').value = ap.hasBalcony !== undefined ? String(ap.hasBalcony) : 'true';
        document.getElementById('editApartmentStatus').value = ap.status || 'AVAILABLE';
        new bootstrap.Modal(document.getElementById('editApartmentModal')).show();
    }

    async function saveApartment() {
        const form = document.getElementById('editApartmentForm');
        const id = document.getElementById('editApartmentId').value;
        const nR = document.getElementById('editApartmentNumber').value.trim();
        const fR = document.getElementById('editApartmentFloor').value.trim();
        const aR = document.getElementById('editApartmentArea').value.trim();
        const pR = document.getElementById('editApartmentPrice').value.trim();
        const type = document.getElementById('editApartmentType').value;
        const bathroom = document.getElementById('editApartmentBathroom').value;
        const balcony = document.getElementById('editApartmentBalcony').value === 'true';
        const status = document.getElementById('editApartmentStatus').value;

        form.querySelectorAll('.form-control,.form-select').forEach(el => el.classList.remove('is-invalid'));
        if (!nR || !fR || !aR || !pR || !type || !bathroom) {
            if (!nR) document.getElementById('editApartmentNumber').classList.add('is-invalid');
            if (!fR) document.getElementById('editApartmentFloor').classList.add('is-invalid');
            if (!aR) document.getElementById('editApartmentArea').classList.add('is-invalid');
            if (!pR) document.getElementById('editApartmentPrice').classList.add('is-invalid');
            if (!type) document.getElementById('editApartmentType').classList.add('is-invalid');
            if (!bathroom) document.getElementById('editApartmentBathroom').classList.add('is-invalid');
            return;
        }
        const number = parseInt(nR), floor = parseInt(fR), area = parseNumberInput(aR), price = parseNumberInput(pR);
        if (isNaN(number) || number < 1) { document.getElementById('editApartmentNumber').classList.add('is-invalid'); return; }
        if (isNaN(floor) || floor < 1) { document.getElementById('editApartmentFloor').classList.add('is-invalid'); return; }
        if (area === null || area <= 0) { document.getElementById('editApartmentArea').classList.add('is-invalid'); return; }
        if (price === null || price < 0) { document.getElementById('editApartmentPrice').classList.add('is-invalid'); return; }

        const dto = { id, number, floor, area, price, type, bathroomType: bathroom, hasBalcony: balcony, status };
        try {
            const res = await fetch(`${API}/apartments/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dto) });
            if (!res.ok) throw new Error('Ошибка сохранения');
            bootstrap.Modal.getInstance(document.getElementById('editApartmentModal')).hide();
            await refreshPoolAndReload();
        } catch (e) { alert('❌ Ошибка: ' + e.message); }
    }

    // =============================================================
    // 16. ПОДПИСКА НА СОБЫТИЯ
    // =============================================================
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('applyFiltersBtn').addEventListener('click', applyFilters);
        document.getElementById('resetFiltersBtn').addEventListener('click', resetFilters);
        document.getElementById('saveApartmentBtn').addEventListener('click', saveApartment);

        // Кнопки типов — toggle + немедленный пересчёт границ слайдеров
        document.querySelectorAll('#filterTypesContainer .type-btn').forEach(btn => {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                this.classList.toggle('active');
                refreshSliderLimits();
            });
        });

        // Изменение «жёстких» фильтров → немедленный пересчёт границ слайдеров
        document.getElementById('filterBathroomType').addEventListener('change', refreshSliderLimits);
        document.getElementById('filterEntrance').addEventListener('change', refreshSliderLimits);
        document.getElementById('filterBalcony').addEventListener('change', refreshSliderLimits);

        document.getElementById('editApartmentModal').addEventListener('hidden.bs.modal', () => {
            document.querySelectorAll('#editApartmentForm .is-invalid').forEach(el => el.classList.remove('is-invalid'));
        });
    });

    loadData();
</script>

<!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->

    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-square"></i> Редактирование квартиры</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editApartmentForm" novalidate>
                    <input type="hidden" id="editApartmentId">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Номер <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="editApartmentNumber" required min="1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Этаж <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="editApartmentFloor" required min="1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Площадь, м² <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="editApartmentArea" placeholder="45.5" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Цена, ₽ <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="editApartmentPrice" placeholder="15000000" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Тип <span class="text-danger">*</span></label>
                            <select class="form-select" id="editApartmentType" required>
                                <option value="">Выберите</option>
                                <option value="STUDIO">Студия</option><option value="ONE_ROOM">1к-ком.</option>
                                <option value="TWO_ROOM_EURO">2Е</option><option value="TWO_ROOM">2к-ком.</option>
                                <option value="THREE_ROOM_EURO">3Е</option><option value="THREE_ROOM">3к-ком.</option>
                                <option value="FOUR_ROOM_EURO">4Е</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Санузел <span class="text-danger">*</span></label>
                            <select class="form-select" id="editApartmentBathroom" required>
                                <option value="">Выберите</option>
                                <option value="COMBINED">Совмещённый</option>
                                <option value="SEPARATE">Раздельный</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Балкон</label>
                            <select class="form-select" id="editApartmentBalcony">
                                <option value="true">Есть</option><option value="false">Нет</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Статус <span class="text-danger">*</span></label>
                            <select class="form-select" id="editApartmentStatus" required>
                                <option value="AVAILABLE">Свободна</option>
                                <option value="RESERVED">Забронирована</option>
                                <option value="SOLD">Продана</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" id="saveApartmentBtn"><i class="bi bi-check-lg"></i> Сохранить</button>
            </div>
        </div>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
        <div class="spinner-border text-primary" role="status"></div>
        <span class="ms-2">Загрузка данных...</span>
    </div>
</div>
</body>
